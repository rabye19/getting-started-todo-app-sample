name: CI Pipeline

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 : Lint backend (Node.js)
  # ─────────────────────────────────────────────
  lint-backend:
    name: Lint Backend (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock

      - name: Installer les dépendances backend
        working-directory: ./backend
        run: yarn install --frozen-lockfile

      - name: Lancer ESLint backend
        working-directory: ./backend
        run: npx eslint . --ext .js || true

  # ─────────────────────────────────────────────
  # JOB 2 : Lint frontend (React)
  # ─────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Installer les dépendances frontend
        working-directory: ./client
        run: yarn install --frozen-lockfile

      - name: Lancer ESLint frontend
        working-directory: ./client
        run: npx eslint . --ext .js,.jsx || true

  # ─────────────────────────────────────────────
  # JOB 3 : Tests unitaires backend
  # ─────────────────────────────────────────────
  test-backend:
    name: Tests Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock

      - name: Installer les dépendances
        working-directory: ./backend
        run: yarn install --frozen-lockfile

      - name: Lancer les tests
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: yarn test || true

  # ─────────────────────────────────────────────
  # JOB 4 : Build frontend Vite
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Installer les dépendances
        working-directory: ./client
        run: yarn install --frozen-lockfile

      - name: Build React (Vite)
        working-directory: ./client
        run: yarn build

  # ─────────────────────────────────────────────
  # JOB 5 : Build + Push Docker Hub
  # context: . car le Dockerfile est à la racine
  # targets : backend-dev et client-dev
  # Push uniquement sur main ou dev
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push image backend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backend-dev
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push image frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: client-dev
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé du build
        run: |
          echo "✅ Build terminé sur : ${{ github.ref_name }}"
          echo "📦 SHA : ${{ github.sha }}"