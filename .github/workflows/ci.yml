name: CI Pipeline

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main", "dev"]

jobs:

  lint-frontend:
    name: "Lint — Frontend (ESLint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: client/yarn.lock
      - working-directory: ./client
        run: yarn install --frozen-lockfile
      - working-directory: ./client
        run: yarn lint

  format-check:
    name: "Code Quality — Prettier"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: backend/yarn.lock
      - working-directory: ./backend
        run: yarn install --frozen-lockfile
      - working-directory: ./backend
        run: yarn format-check

  test-backend:
    name: "Tests — Backend (Jest)"
    runs-on: ubuntu-latest
    needs: [lint-frontend, format-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: backend/yarn.lock
      - working-directory: ./backend
        run: yarn install --frozen-lockfile
      - working-directory: ./backend
        run: yarn test
        env:
          NODE_ENV: test

  docker-build:
    name: "Docker — Build image finale"
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: final
          push: false
          tags: todo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
